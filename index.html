<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Hindi & English Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
            background-color: #f4f7f6;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 { color: #2c3e50; text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 18px;
            box-sizing: border-box;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-left: 5px solid #3498db;
            background: #eef2f3;
            position: relative;
        }
        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .label { font-weight: bold; color: #7f8c8d; font-size: 14px; }
        .output { font-size: 20px; color: #2c3e50; margin-bottom: 15px; min-height: 24px; }
        .hindi { font-family: 'Arial Unicode MS', sans-serif; }
        
        /* Sound Button Style */
        .speak-btn {
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .speak-btn:hover { background: #2980b9; }
        .speak-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Number to Words</h2>
    <input type="number" id="numberInput" placeholder="Type a number (e.g., 23456)" oninput="convert()">

    <div class="result-box">
        <div class="label-container">
            <span class="label">HINDI (हिन्दी)</span>
            <button class="speak-btn" onclick="speak('hindiOutput', 'hi-IN')">🔊 Listen</button>
        </div>
        <div id="hindiOutput" class="output hindi">—</div>

        <div class="label-container">
            <span class="label">ENGLISH</span>
            <button class="speak-btn" onclick="speak('englishOutput', 'en-US')">🔊 Listen</button>
        </div>
        <div id="englishOutput" class="output">—</div>
    </div>
</div>

<script>
    const hindiWords = {
        0: 'शून्य', 1: 'एक', 2: 'दो', 3: 'तीन', 4: 'चार', 5: 'पाँच', 6: 'छह', 7: 'सात', 8: 'आठ', 9: 'नौ', 10: 'दस',
        11: 'ग्यारह', 12: 'बारह', 13: 'तेरह', 14: 'चौदह', 15: 'पंद्रह', 16: 'सोलह', 17: 'सत्रह', 18: 'अठारह', 19: 'उन्नीस', 20: 'बीस',
        21: 'इक्कीस', 22: 'बाईस', 23: 'तेईस', 24: 'चौबीस', 25: 'पच्चीस', 26: 'छब्बीस', 27: 'सत्ताईस', 28: 'अट्ठाइस', 29: 'उनतीस', 30: 'तीस',
        31: 'इकतीस', 32: 'बत्तीस', 33: 'तैंतीस', 34: 'चौंतीस', 35: 'पैंतीस', 36: 'छत्तीस', 37: 'सैंतीस', 38: 'अड़तीस', 39: 'उनतालीस', 40: 'चालीस',
        41: 'इकतालीस', 42: 'बयालीस', 43: 'तैंतालीस', 44: 'चवालीस', 45: 'पैंतालीस', 46: 'छियालीस', 47: 'सैंतालीस', 48: 'अड़तालीस', 49: 'उनचास', 50: 'पचास',
        51: 'इक्यावन', 52: 'बावन', 53: 'तिरेपन', 54: 'चव्वन', 55: 'पचपन', 56: 'छप्पन', 57: 'सत्तावन', 58: 'अट्ठावन', 59: 'उनसठ', 60: 'साठ',
        61: 'इकसठ', 62: 'बासठ', 63: 'तिरसठ', 64: 'चौंसठ', 65: 'पैंसठ', 66: 'छियासठ', 67: 'सरसठ', 68: 'अड़सठ', 69: 'उनहत्तर', 70: 'सत्तर',
        71: 'इकहत्तर', 72: 'बहत्तर', 73: 'तिहत्तर', 74: 'चौहत्तर', 75: 'पचहत्तर', 76: 'छहत्तर', 77: 'सतहत्तर', 78: 'अठहत्तर', 79: 'उन्यासी', 80: 'अस्सी',
        81: 'इक्यासी', 82: 'बयासी', 83: 'तिरासी', 84: 'चौरासी', 85: 'पचासी', 86: 'छियासी', 87: 'सतासी', 88: 'अठासी', 89: 'नवासी', 90: 'नब्बे',
        91: 'इक्यानवे', 92: 'बयानवे', 93: 'तिरानवे', 94: 'चौरानवे', 95: 'पचानवे', 96: 'छियानवे', 97: 'सत्तानवे', 98: 'अट्ठानवे', 99: 'निन्यानवे'
    };

    function numToHindi(num) {
        if (num == 0) return hindiWords[0];
        let str = "";
        if (num >= 10000000) {
            str += numToHindi(Math.floor(num / 10000000)) + " करोड़ ";
            num %= 10000000;
        }
        if (num >= 100000) {
            str += numToHindi(Math.floor(num / 100000)) + " लाख ";
            num %= 100000;
        }
        if (num >= 1000) {
            str += numToHindi(Math.floor(num / 1000)) + " हजार ";
            num %= 1000;
        }
        if (num >= 100) {
            str += numToHindi(Math.floor(num / 100)) + " सौ ";
            num %= 100;
        }
        if (num > 0) {
            str += hindiWords[num];
        }
        return str.trim();
    }

    function numToEnglish(num) {
        const ones = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
        const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
        
        if (num === 0) return "Zero";

        function helper(n) {
            let s = "";
            if (n >= 100) {
                s += ones[Math.floor(n / 100)] + " Hundred ";
                n %= 100;
            }
            if (n >= 20) {
                s += tens[Math.floor(n / 10)] + (n % 10 !== 0 ? "-" + ones[n % 10] : "");
            } else if (n > 0) {
                s += ones[n];
            }
            return s.trim();
        }

        let res = "";
        if (num >= 1000000000) { res += helper(Math.floor(num / 1000000000)) + " Billion "; num %= 1000000000; }
        if (num >= 1000000) { res += helper(Math.floor(num / 1000000)) + " Million "; num %= 1000000; }
        if (num >= 1000) { res += helper(Math.floor(num / 1000)) + " Thousand "; num %= 1000; }
        res += helper(num);
        return res.trim();
    }

    function convert() {
        const val = document.getElementById("numberInput").value;
        const hOut = document.getElementById("hindiOutput");
        const eOut = document.getElementById("englishOutput");

        if (val === "") {
            hOut.innerText = "—";
            eOut.innerText = "—";
            return;
        }
        const n = parseInt(val);
        hOut.innerText = numToHindi(n);
        eOut.innerText = numToEnglish(n);
    }

    // New Voice Function
    function speak(elementId, lang) {
        const text = document.getElementById(elementId).innerText;
        if (text === "—") return;

        // Cancel any ongoing speech
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.9; // Slightly slower for clarity
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
